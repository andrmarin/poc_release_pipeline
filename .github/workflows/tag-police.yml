name: Tag police

run-name: "Tag police: ${{ github.ref_name }}"

# Deletes malformed v* tags the moment they are pushed. Ruleset-level name
# validation (tag_name_pattern) requires GitHub Enterprise, so on this plan
# the protect-release-tags ruleset only covers WELL-FORMED release tags
# (exact fnmatch include) — malformed look-alikes are outside it, which is
# precisely what lets this workflow delete them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # delete malformed tags

jobs:
  validate:
    name: validate tag name
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce release-version format
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}[.][0-9]{2}[.][0-9]{2}[.][0-9]{4}$ ]]; then
            echo "ok: '$GITHUB_REF_NAME' is a well-formed release tag"
            exit 0
          fi
          echo "Deleting malformed tag '$GITHUB_REF_NAME' ..."
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME"
          echo "::error::Tag '$GITHUB_REF_NAME' does not match the release format vYYYY.MM.DD.NNNN and has been deleted." \
               "Release tags are created only by the release workflow — see docs/HOW_TO_RELEASE.md."
          exit 1
