name: Release

# Shown as the run title in the Actions tab — without this, every run is
# just "Release" with no hint of the target environment.
run-name: "Release: ${{ inputs.environment }} @ ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# Never cancel a running release; a second dispatch queues behind it.
concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Require main or hotfix/* branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/hotfix/*)
              echo "Dispatched from $GITHUB_REF — ok" ;;
            *)
              echo "::error::Releases must be dispatched from 'main' or a 'hotfix/*' branch, got '$GITHUB_REF'"
              exit 1 ;;
          esac

      # SIM_FAIL_* repository variables arm negative-path drills (see README).
      # Production releases must never run with a simulation enabled.
      - name: Refuse failure simulation in production
        if: inputs.environment == 'production' && vars.SIM_FAIL_UPLOAD == 'true'
        run: |
          echo "::error::SIM_FAIL_UPLOAD is enabled — failure simulation must be off for production releases." \
               "Disarm it first: gh variable set SIM_FAIL_UPLOAD --body false"
          exit 1

  build:
    name: build
    needs: guard
    runs-on: ubuntu-latest
    # The environment gate: 'production' requires reviewer approval before
    # this job (and everything after it) runs.
    environment: ${{ inputs.environment }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history + tags, needed for the unmerged-hotfix guard

      - name: Unmerged-hotfix guard
        if: inputs.environment == 'production' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-staging' | head -n 1 || true)"
          if [[ -z "$last_tag" ]] || git merge-base --is-ancestor "$last_tag" HEAD; then
            echo "ok: ${last_tag:-no previous production tag} is an ancestor of HEAD"
            exit 0
          fi
          # This repo is squash-merge only, which rewrites commits — so a
          # forward-merged hotfix tag is never a literal ancestor of main.
          # Accept the tag if its commit belongs to a PR merged into main.
          tag_sha="$(git rev-list -n 1 "$last_tag")"
          merged_pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_sha/pulls" \
            --jq '.[] | select(.base.ref == "main" and .merged_at != null) | .number' | head -n 1 || true)"
          if [[ -n "$merged_pr" ]]; then
            echo "ok: $last_tag is not a literal ancestor (squash-merge), but PR #$merged_pr containing it was merged into main"
            exit 0
          fi
          echo "::error::Latest production tag '$last_tag' is not an ancestor of main and no merged PR contains its commit." \
               "A hotfix was released but never merged forward — releasing now would regress it." \
               "Merge the hotfix PR into main first."
          exit 1

      - name: Compute version
        id: version
        run: |
          # Run number is zero-padded: GitHub's Releases page orders entries by
          # comparing tag names as strings, so fixed-width components are required
          # to keep newest-on-top (v...13 would sort below v...9 otherwise).
          version="v$(date -u +%Y.%m.%d).$(printf '%04d' "$GITHUB_RUN_NUMBER")"
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            version="${version}-staging"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Run numbers are frozen per run, so re-running an old failed run on the
      # same day would compute a version LOWER than the latest release (and a
      # production re-run would even steal the "Latest" marker). Require the
      # computed version to sort strictly above the newest existing v* tag.
      - name: Monotonic version guard
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="${VERSION%-staging}"
          highest="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-staging' | head -n 1 || true)"
          if [[ -n "$highest" ]]; then
            newest="$(printf '%s\n%s\n' "$highest" "$base" | sort -V | tail -n 1)"
            if [[ "$newest" != "$base" || "$base" == "$highest" ]]; then
              echo "::error::Computed version $VERSION is not newer than the latest release ($highest)." \
                   "This usually means an old failed run was re-run — run numbers are frozen per run." \
                   "Dispatch a fresh release run instead."
              exit 1
            fi
          fi
          echo "ok: $VERSION is newer than ${highest:-<no releases yet>}"

      - name: Build
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/build.sh

      # Single source of truth for the artifact name is the ZIP build.sh
      # produced — unique per run (version embeds date + padded run number),
      # so downloads never collide in a Downloads folder.
      - name: Artifact name
        id: artifact
        run: |
          files=(dist/*.zip)
          echo "name=$(basename "${files[0]}" .zip)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          # SIM_FAIL_UPLOAD drill: when armed, this step reads a deliberately
          # empty location and fails on if-no-files-found — the failure happens
          # IN this step; the build output in dist/ and all prior steps are
          # untouched. The sentinel path doubles as the how-to-fix message.
          path: ${{ vars.SIM_FAIL_UPLOAD == 'true' && 'SIMULATED-FAILURE_disarm-with_gh-variable-set-SIM_FAIL_UPLOAD-false_see-README/*' || 'dist/*' }}
          retention-days: ${{ inputs.environment == 'staging' && 30 || 1 }}
          if-no-files-found: error

      - name: Explain simulated upload failure
        if: failure() && vars.SIM_FAIL_UPLOAD == 'true'
        run: |
          echo "::error title=Simulated failure — SIM_FAIL_UPLOAD drill::The 'Upload artifact' failure above is INTENTIONAL: the repository variable SIM_FAIL_UPLOAD is set to 'true'. Disarm it with: gh variable set SIM_FAIL_UPLOAD --body false — see README, section 'Simulating failures (negative-path drills)'."
          {
            echo "## 🧪 Simulated upload failure (drill)"
            echo
            echo "The \`Upload artifact\` failure in this run is **intentional** — the repository"
            echo "variable \`SIM_FAIL_UPLOAD\` is currently \`true\`. Nothing is wrong with the build."
            echo
            echo '```sh'
            echo "gh variable set SIM_FAIL_UPLOAD --body false   # disarm the drill"
            echo '```'
            echo
            echo "Details: README → *Simulating failures (negative-path drills)*."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Verify artifact
        run: |
          files=(dist/*.zip)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one ZIP, found: ${files[*]}"; exit 1; }
          bash scripts/verify.sh "${files[0]}" "${{ inputs.environment }}"

  publish:
    name: publish
    if: inputs.environment == 'production'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub Release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Refuse to overwrite an existing tag
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists — refusing to overwrite. Dispatch a fresh release run."
            exit 1
          fi

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      # Draft-first publish: a draft release creates NO tag and is not public,
      # so a failed asset upload leaves nothing half-released. The failure
      # handler below deletes the leftover draft.
      #
      # The draft's id is captured from the create response and passed between
      # steps — never searched by name afterwards. (Searching the list endpoint
      # for a just-created draft proved unreliable: runs failed with "Draft
      # release not found" even though the draft existed.)
      - name: Create draft release with assets
        id: draft
        run: |
          release_id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$VERSION" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq '.id')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Created draft release $VERSION (id $release_id)"

          for f in dist/*.zip dist/*.zip.sha256; do
            echo "Uploading $(basename "$f")"
            gh api -X POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$(basename "$f")" \
              --input "$f" >/dev/null
          done

      - name: Verify draft assets, then publish
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          [[ -n "$RELEASE_ID" ]] || { echo "::error::No release id from the create step"; exit 1; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')" == "true" ]] \
            || { echo "::error::Release $RELEASE_ID is not a draft"; exit 1; }

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.state == "uploaded") | .name')"
          grep -q  '\.zip$'        <<<"$assets" || { echo "::error::ZIP asset missing from draft"; exit 1; }
          grep -q  '\.zip\.sha256$' <<<"$assets" || { echo "::error::Checksum asset missing from draft"; exit 1; }

          # Publishing the draft is what creates the v* tag — the final,
          # smallest possible step.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true >/dev/null
          echo "Published release $VERSION (id $RELEASE_ID)"

      - name: Delete leftover draft on failure
        if: failure()
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          if [[ -n "$RELEASE_ID" ]] && \
             [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft' 2>/dev/null)" == "true" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
            echo "Deleted draft release $RELEASE_ID — no tag or public release was created."
          else
            echo "No leftover draft to clean up."
          fi

  post-publish-verify:
    name: post-publish verify
    if: inputs.environment == 'production'
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download asset from the published release
        run: gh release download "$VERSION" --dir published

      - name: Verify released asset
        run: |
          files=(published/*.zip)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one ZIP, found: ${files[*]}"; exit 1; }
          bash scripts/verify.sh "${files[0]}" production

      # GitHub's run-duration display is wall clock INCLUDING approval wait and
      # cannot be configured — so report the actual execution time ourselves.
      - name: Report real pipeline duration
        if: always()
        run: |
          exec_s="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.started_at != null and .conclusion != "skipped")
                   | (((.completed_at // (now | todate)) | fromdateiso8601) - (.started_at | fromdateiso8601))]
                  | add | floor')"
          wall_s="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '(now - (.run_started_at | fromdateiso8601)) | floor')"
          wait_s=$(( wall_s > exec_s ? wall_s - exec_s : 0 ))
          fmt() { printf '%dm %02ds' $(($1 / 60)) $(($1 % 60)); }
          echo "execution=$(fmt "$exec_s") wall=$(fmt "$wall_s") waiting=$(fmt "$wait_s")"
          {
            echo "### ⏱ Pipeline duration"
            echo
            echo "| Metric | Time |"
            echo "|---|---|"
            echo "| **Actual execution** (sum of job run times) | **$(fmt "$exec_s")** |"
            echo "| Wall clock (what the Actions list shows) | $(fmt "$wall_s") |"
            echo "| Waiting (approval gate + queueing) | $(fmt "$wait_s") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Self-hosted README badges: rendered here and pushed to the unprotected
  # 'badges' branch (seeded by setup-github.sh), served via
  # raw.githubusercontent.com. Replaces shields.io's GitHub integrations,
  # which intermittently fail with "Unable to select next GitHub token from
  # pool".
  badge:
    name: badge
    if: always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    needs: [build, test, publish, post-publish-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push badge updates to the badges branch
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Render badges
        id: render
        run: |
          env_name="${{ inputs.environment }}"
          test_r="${{ needs.test.result }}"
          pub_r="${{ needs.publish.result }}"
          ppv_r="${{ needs['post-publish-verify'].result }}"
          if [[ "$test_r" == "cancelled" || "$pub_r" == "cancelled" || "$ppv_r" == "cancelled" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Run was cancelled — leaving badges unchanged."
            exit 0
          fi
          mkdir -p out
          if [[ "$env_name" == "staging" ]]; then
            [[ "$test_r" == "success" ]] && status=passing || status=failing
          else
            [[ "$pub_r" == "success" && "$ppv_r" == "success" ]] && status=passing || status=failing
          fi
          color="#4c1"; [[ "$status" == "failing" ]] && color="#e05d44"
          bash scripts/badge.sh "$env_name" "$status" "$color" > "out/$env_name.svg"
          echo "rendered $env_name: $status"
          if [[ "$env_name" == "production" && "$status" == "passing" ]]; then
            bash scripts/badge.sh "latest release" "$VERSION" "#007ec6" > out/latest-release.svg
            echo "rendered latest release: $VERSION"
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Push to badges branch
        if: steps.render.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges
          git worktree add bw FETCH_HEAD
          cp out/*.svg bw/
          cd bw
          git add .
          if git diff --cached --quiet; then
            echo "Badges already up to date."
            exit 0
          fi
          git commit -q -m "badges: ${{ inputs.environment }} run #$GITHUB_RUN_NUMBER"
          # Staging and production runs may race on this branch — retry with rebase.
          for i in 1 2 3; do
            git push origin HEAD:badges && exit 0
            git pull --rebase origin badges
          done
          echo "::error::Failed to push badge update after 3 attempts."
          exit 1
