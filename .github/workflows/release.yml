name: Release

# Shown as the run title in the Actions tab — without this, every run is
# just "Release" with no hint of the target environment.
run-name: "Release: ${{ inputs.environment }} @ ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# Never cancel a running release; a second dispatch queues behind it.
concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Require main or hotfix/* branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/hotfix/*)
              echo "Dispatched from $GITHUB_REF — ok" ;;
            *)
              echo "::error::Releases must be dispatched from 'main' or a 'hotfix/*' branch, got '$GITHUB_REF'"
              exit 1 ;;
          esac

  build:
    name: build
    needs: guard
    runs-on: ubuntu-latest
    # The environment gate: 'production' requires reviewer approval before
    # this job (and everything after it) runs.
    environment: ${{ inputs.environment }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history + tags, needed for the unmerged-hotfix guard

      - name: Unmerged-hotfix guard
        if: inputs.environment == 'production' && github.ref == 'refs/heads/main'
        run: |
          last_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-staging' | head -n 1 || true)"
          if [[ -n "$last_tag" ]] && ! git merge-base --is-ancestor "$last_tag" HEAD; then
            echo "::error::Latest production tag '$last_tag' is not an ancestor of main." \
                 "A hotfix was released but never merged forward — releasing now would regress it." \
                 "Merge the hotfix PR into main first."
            exit 1
          fi
          echo "ok: ${last_tag:-no previous production tag} is an ancestor of HEAD"

      - name: Compute version
        id: version
        run: |
          version="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            version="${version}-staging"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-app-${{ inputs.environment }}
          path: dist/*
          retention-days: ${{ inputs.environment == 'staging' && 30 || 1 }}
          if-no-files-found: error

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sample-app-${{ inputs.environment }}
          path: dist

      - name: Verify artifact
        run: |
          files=(dist/*.zip)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one ZIP, found: ${files[*]}"; exit 1; }
          bash scripts/verify.sh "${files[0]}" "${{ inputs.environment }}"

  publish:
    name: publish
    if: inputs.environment == 'production'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub Release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Refuse to overwrite an existing tag
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists — refusing to overwrite. Dispatch a fresh release run."
            exit 1
          fi

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sample-app-production
          path: dist

      # Draft-first publish: a draft release creates NO tag and is not public,
      # so a failed asset upload leaves nothing half-released. The failure
      # handler below deletes the leftover draft.
      - name: Create draft release with assets
        run: |
          gh release create "$VERSION" dist/*.zip dist/*.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --draft

      - name: Verify draft assets, then publish
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id" | head -n 1)"
          [[ -n "$release_id" ]] || { echo "::error::Draft release for $VERSION not found"; exit 1; }

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.state == "uploaded") | .name')"
          grep -q  '\.zip$'        <<<"$assets" || { echo "::error::ZIP asset missing from draft"; exit 1; }
          grep -q  '\.zip\.sha256$' <<<"$assets" || { echo "::error::Checksum asset missing from draft"; exit 1; }

          # Publishing the draft is what creates the v* tag — the final,
          # smallest possible step.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true >/dev/null
          echo "Published release $VERSION (id $release_id)"

      - name: Delete leftover draft on failure
        if: failure()
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id" | head -n 1)"
          if [[ -n "$release_id" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            echo "Deleted draft release $release_id — no tag or public release was created."
          fi

  smoke:
    name: smoke
    if: inputs.environment == 'production'
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download asset from the published release
        run: gh release download "$VERSION" --dir smoke

      - name: Verify released asset
        run: |
          files=(smoke/*.zip)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one ZIP, found: ${files[*]}"; exit 1; }
          bash scripts/verify.sh "${files[0]}" production
