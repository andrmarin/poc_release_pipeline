name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which apps this change affects. apps/<app>/** -> just that app;
  # shared paths (scripts/, workflows) -> both; docs-only -> none.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Fall back to "build everything" when the base is missing, the
          # all-zeros sentinel (new branch), or not present in this clone.
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base" 2>/dev/null; then
            changed="__ALL__"
          else
            changed="$(git diff --name-only "$base" HEAD)"
          fi
          echo "Changed files:"; echo "$changed"

          apps=()
          if [[ "$changed" == "__ALL__" ]] || grep -qE '^(scripts/|\.github/workflows/)' <<<"$changed"; then
            apps=(desktop browser)
          else
            grep -qE '^apps/desktop/' <<<"$changed" && apps+=(desktop)
            grep -qE '^apps/browser/' <<<"$changed" && apps+=(browser)
          fi

          if [[ ${#apps[@]} -eq 0 ]]; then
            json='[]'
          else
            json="$(printf '%s\n' "${apps[@]}" | jq -R . | jq -cs .)"
          fi
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Apps to build: $json"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compute development version
        id: version
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "version=v$(date -u +%Y.%m.%d).$(printf '%04d' "$GITHUB_RUN_NUMBER")-dev+${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          APP: ${{ matrix.app }}
          ENVIRONMENT: development
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/build.sh

      - name: Artifact name
        id: artifact
        run: |
          files=(dist/*.zip)
          echo "name=$(basename "${files[0]}" .zip)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  test:
    name: test
    needs: [changes, build]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.app }}-*
          path: dl
          merge-multiple: true

      - name: Verify artifact
        run: |
          files=(dl/${{ matrix.app }}-*.zip)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one ${{ matrix.app }} ZIP, found: ${files[*]}"; exit 1; }
          bash scripts/verify.sh "${files[0]}" development "${{ matrix.app }}"

  # Single required status check. Always runs and reports, so branch protection
  # never deadlocks when an app's build/test is skipped (it didn't change).
  ci:
    name: ci
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on build/test results
        run: |
          b="${{ needs.build.result }}"
          t="${{ needs.test.result }}"
          echo "build=$b test=$t"
          if [[ "$b" == "failure" || "$b" == "cancelled" || "$t" == "failure" || "$t" == "cancelled" ]]; then
            echo "::error::CI failed (build=$b test=$t)"
            exit 1
          fi
          echo "CI passed (skipped = no app changed, which is fine)."
