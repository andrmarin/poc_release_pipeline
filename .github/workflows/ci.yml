name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Compute development version
        id: version
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "version=v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}-dev+${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ENVIRONMENT: development
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-app-development
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sample-app-development
          path: dist

      - name: Verify artifact
        run: |
          files=(dist/*.zip)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one ZIP, found: ${files[*]}"; exit 1; }
          bash scripts/verify.sh "${files[0]}" development
